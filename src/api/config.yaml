# 复制为 config.local.yaml 后填写实际配置，通过 --config 指定；不要提交真实密钥。
app:
  name: iwiki
  environment: development
  # 用于上传对象日期目录；数据库时间仍使用 UTC。
  timezone: Asia/Shanghai
  debug: false
  addr: ':8020'
  log_level: info
  frontend_url: http://localhost:5173
  shutdown_timeout: 15s
http:
  cors_allow_origins: [http://localhost:5173]
  trusted_proxy_cidrs: []
  request_timeout: 20s
  read_header_timeout: 5s
  read_timeout: 25s
  write_timeout: 30s
  idle_timeout: 60s
  health_check_timeout: 3s
  body_limit: 8M
  max_header_bytes: 1048576
  default_page_size: 10
  max_page_size: 100
mysql:
  transaction_retries: 2
  # MySQL 连接地址。
  dsn: ''
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m
  connect_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
redis:
  addr: ''
  password: ''
  db: 0
  # Redis 键名前缀。
  prefix: 'iwiki:go:v1:'
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 3s
  ping_timeout: 3s
  pool_size: 20
  max_retries: 1
oidc:
  # 身份提供方；sub 对应用户名，最长 32 字符。
  issuer: ''
  client_id: ''
  client_secret: ''
  redirect_url: http://localhost:5173/login/callback
  request_timeout: 10s
  state_ttl: 10m
  login_rate: 30
  login_window: 1m
session:
  ttl: 168h
  cookie_name: iwiki_go_session
  cookie_domain: ''
  # 生产环境必须使用 HTTPS 并设为 true；前后端须部署在同一站点。
  cookie_secure: false
  user_whitelist: []
document:
  # title、content、all 或空字符串；空字符串关闭关键词搜索。
  search_type: all
  max_content_bytes: 5242880
  max_tags: 100
  max_search_values: 100
cos:
  enabled: false
  secret_id: ''
  secret_key: ''
  region: ap-beijing
  bucket: ''
  url: ''
  sts_endpoint: sts.tencentcloudapi.com
  credential_ttl: 10m
  request_timeout: 10s
  max_file_bytes: 10485760
  cdn_signing_key: ''
  cdn_parameter: eo-sign
trace:
  # 关闭上报仍生成真实 Trace ID。
  report_enabled: false
  endpoint: localhost:4317
  insecure: false
  headers: {}
  export_timeout: 5s
  batch_timeout: 5s
  max_queue_size: 2048
  max_export_batch_size: 512
