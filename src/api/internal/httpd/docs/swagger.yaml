basePath: /
definitions:
  cosModels.Credential:
    properties:
      cdn_sign:
        description: CDN 短时签名，可空。
        type: string
      cdn_sign_param:
        description: CDN 签名参数名称。
        type: string
      cos_bucket:
        description: 存储桶名称。
        type: string
      cos_region:
        description: 存储地域。
        type: string
      cos_url:
        description: COS 或 CDN 资源地址。
        type: string
      expired_time:
        description: 临时凭据失效时间，Unix 秒。
        type: integer
      key:
        description: 上传对象路径。
        type: string
      max_file_bytes:
        description: 文件大小上限，单位为字节。
        type: integer
      secret_id:
        description: 临时访问密钥编号。
        type: string
      secret_key:
        description: 临时访问密钥。
        type: string
      start_time:
        description: 临时凭据开始时间，Unix 秒。
        type: integer
      token:
        description: 临时安全令牌。
        type: string
    type: object
  cosModels.CredentialEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/cosModels.Credential'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  cosModels.Request:
    properties:
      filename:
        description: 文件名，不含路径。
        example: 示例图片.png
        type: string
    type: object
  docModels.Detail:
    properties:
      comments:
        description: 评论数量。
        type: integer
      content:
        description: Markdown 正文。
        type: string
      created_at:
        description: 创建时间，UTC。
        type: string
      header_img:
        description: 封面地址，可空。
        type: string
      id:
        description: 编号。
        type: string
      is_public:
        description: 是否允许其他已登录用户读取。
        type: boolean
      owner:
        description: 作者用户名。
        example: zhangsan
        type: string
      owner_nick_name:
        description: 作者昵称。
        example: 张三
        type: string
      pv:
        description: 阅读量。
        type: integer
      tags:
        description: 标签名称集合。
        items:
          type: string
        type: array
      title:
        description: 文档标题，最多 32 个字符。
        example: Go 学习笔记
        type: string
      updated_at:
        description: 更新时间，UTC。
        type: string
    type: object
  docModels.DetailEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/docModels.Detail'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  docModels.EditRequest:
    properties:
      content:
        description: Markdown 正文。
        example: '# 学习笔记'
        type: string
      created_at:
        description: 创建时间，可选。
        type: string
      header_img:
        description: 封面，可空。
        example: ""
        type: string
      is_public:
        description: 是否向其他登录用户公开。
        example: true
        type: boolean
      tags:
        description: 完整标签集合，空数组清空。
        example:
        - 技术
        - 笔记
        items:
          type: string
        type: array
      title:
        description: 标题，最多 32 字符。
        example: Go 学习笔记
        type: string
    type: object
  docModels.IDEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/docModels.IDResult'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  docModels.IDResult:
    properties:
      id:
        description: 编号。
        example: 0123456789abcdef0123456789abcdef
        type: string
    type: object
  docModels.ListItem:
    properties:
      comments:
        description: 评论数量。
        type: integer
      created_at:
        description: 创建时间，UTC。
        type: string
      header_img:
        description: 封面地址，可空。
        type: string
      id:
        description: 编号。
        type: string
      is_public:
        description: 是否允许其他已登录用户读取。
        type: boolean
      owner:
        description: 作者用户名。
        example: zhangsan
        type: string
      owner_nick_name:
        description: 作者昵称。
        example: 张三
        type: string
      pv:
        description: 阅读量。
        type: integer
      tags:
        description: 标签名称集合。
        items:
          type: string
        type: array
      title:
        description: 文档标题，最多 32 个字符。
        example: Go 学习笔记
        type: string
      updated_at:
        description: 更新时间，UTC。
        type: string
    type: object
  docModels.Page:
    properties:
      current:
        description: 当前页码。
        type: integer
      results:
        description: 当前页结果。
        items:
          $ref: '#/definitions/docModels.ListItem'
        type: array
      total:
        description: 全部匹配记录数。
        type: integer
    type: object
  docModels.PageEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/docModels.Page'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  docModels.Tag:
    properties:
      id:
        description: 编号。
        example: 0123456789abcdef0123456789abcdef
        type: string
      name:
        example: 技术
        type: string
    type: object
  docModels.TagsEnvelope:
    properties:
      data:
        description: 业务数据。
        items:
          $ref: '#/definitions/docModels.Tag'
        type: array
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  homeModels.Features:
    properties:
      doc_fuzzy_search:
        description: 是否允许关键词搜索。
        type: boolean
    type: object
  homeModels.FeaturesEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/homeModels.Features'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  homeModels.Home:
    properties:
      resp:
        description: 首页连接状态。
        example: 连接成功
        type: string
      user:
        allOf:
        - $ref: '#/definitions/userModels.Info'
        description: 当前用户。
    type: object
  homeModels.HomeEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/homeModels.Home'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  permissionModels.ListEnvelope:
    properties:
      data:
        description: 业务数据。
        items:
          $ref: '#/definitions/permissionModels.Permission'
        type: array
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  permissionModels.Permission:
    properties:
      expired_at:
        description: 失效时间，空值为长期有效。
        type: string
      permission_item:
        description: 授权项，仅支持 create_doc 或 upload_file。
        example: create_doc
        type: string
    type: object
  response.EmptyEnvelope:
    properties:
      data:
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  userModels.Info:
    properties:
      last_login:
        description: 最近登录时间，UTC。
        type: string
      nick_name:
        description: 用户昵称。
        example: 张三
        type: string
      user_type:
        description: 账号类型。
        example: personal
        type: string
      username:
        description: 当前账号用户名。
        example: zhangsan
        type: string
    type: object
  userModels.InfoEnvelope:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/userModels.Info'
        description: 业务数据。
      error_msg:
        description: 错误提示。
        example: ""
        type: string
      trace:
        description: 请求追踪编号。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
info:
  contact: {}
  description: 文档、标签和文件上传服务。
  title: iWiki 接口
  version: "1.0"
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 检查进程存活
      tags:
      - 探针
  /ready:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 检查服务就绪
      tags:
      - 探针
  /v1/auth/logout:
    post:
      parameters:
      - default: "1"
        description: 来源保护标记，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 退出登录
      tags:
      - 登录
  /v1/auth/oidc/callback:
    get:
      parameters:
      - description: 授权码，与 error 二选一
        in: query
        name: code
        type: string
      - description: 一次性登录状态
        in: query
        name: state
        required: true
        type: string
      - description: 身份提供方错误代码
        in: query
        name: error
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "302":
          description: 登录成功并返回访问页面
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 接收 OIDC 回调
      tags:
      - 登录
  /v1/auth/oidc/login:
    get:
      description: 跳转至登录页面，登录后返回指定页面。
      parameters:
      - default: /
        description: 登录后的站内路径
        in: query
        name: return_to
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "302":
          description: 跳转至身份提供方
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 发起 OIDC 登录
      tags:
      - 登录
  /v1/cos/temp-secret:
    post:
      consumes:
      - application/json
      parameters:
      - description: 文件信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cosModels.Request'
      - default: "1"
        description: 来源保护标记，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cosModels.CredentialEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 获取 COS 临时上传凭据
      tags:
      - 上传
  /v1/docs:
    get:
      description: 标签取并集；同一字段须包含全部关键词，多个搜索字段取并集。
      parameters:
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10、最大 100
        in: query
        name: size
        type: integer
      - collectionFormat: multi
        description: 标签名称
        in: query
        items:
          type: string
        name: tags
        type: array
      - collectionFormat: multi
        description: 关键词
        in: query
        items:
          type: string
        name: keywords
        type: array
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docModels.PageEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询文档列表
      tags:
      - 文档
    post:
      consumes:
      - application/json
      parameters:
      - description: 文档资料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docModels.EditRequest'
      - default: "1"
        description: 来源保护标记，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docModels.IDEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 创建文档
      tags:
      - 文档
  /v1/docs/{id}:
    delete:
      parameters:
      - description: 文档编号
        in: path
        name: id
        required: true
        type: string
      - default: "1"
        description: 来源保护标记，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 删除文档
      tags:
      - 文档
    get:
      parameters:
      - description: 文档编号
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docModels.DetailEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询文档详情
      tags:
      - 文档
    put:
      consumes:
      - application/json
      parameters:
      - description: 文档编号
        in: path
        name: id
        required: true
        type: string
      - description: 完整文档资料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docModels.EditRequest'
      - default: "1"
        description: 来源保护标记，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docModels.IDEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 修改文档
      tags:
      - 文档
  /v1/features:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homeModels.FeaturesEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询功能开关
      tags:
      - 首页
  /v1/home:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homeModels.HomeEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询首页信息
      tags:
      - 首页
  /v1/permissions:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/permissionModels.ListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询当前权限
      tags:
      - 权限
  /v1/tags:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docModels.TagsEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询全部标签
      tags:
      - 标签
  /v1/tags/bound:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docModels.TagsEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询已绑定标签
      tags:
      - 标签
  /v1/user-info:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userModels.InfoEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.EmptyEnvelope'
      summary: 查询当前用户
      tags:
      - 用户
swagger: "2.0"
